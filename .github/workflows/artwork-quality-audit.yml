name: Artwork Quality Audit

on:
  pull_request:
    paths:
      - "scripts/art_generator.py"
      - "scripts/theme_art.py"
      - "scripts/theme_christmas.py"
      - "scripts/artwork_quality.py"
      - "scripts/artwork_audit_target.py"
      - "tests/test_artwork_audit_target.py"
      - "config/artwork_generation_spec.json"
      - ".github/workflows/artwork-quality-audit.yml"
  workflow_dispatch:
    inputs:
      theme:
        description: Artwork theme to generate and inspect
        required: true
        type: choice
        options:
          - fruit
          - flowers
          - toys
          - birds
          - animals
          - professions
          - christmas
        default: fruit

permissions:
  contents: read

concurrency:
  group: artwork-quality-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install existing pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Resolve review theme and design count
        id: target
        env:
          REQUESTED_THEME: ${{ github.event.inputs.theme || '' }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          HEAD_REF: ${{ github.head_ref }}
        run: python -m scripts.artwork_audit_target >> "$GITHUB_OUTPUT"

      - name: Generate selected theme review set
        env:
          THEME: ${{ steps.target.outputs.theme }}
          COUNT: ${{ steps.target.outputs.count }}
        run: |
          python - <<'PY'
          import os
          from scripts.art_generator import generate_artwork

          theme = os.environ["THEME"]
          count = int(os.environ["COUNT"])
          line_width_pt = 9.0 if theme == "christmas" else 2.4
          generate_artwork(theme, count, "build/artwork-pilot", dpi=300, line_width_pt=line_width_pt)
          PY

      - name: Run deterministic artwork audit
        run: |
          python -m scripts.artwork_quality \
            --input-dir build/artwork-pilot \
            --spec config/artwork_generation_spec.json \
            --report build/artwork-quality-report.json \
            --contact-sheet build/artwork-contact-sheet.png

      - name: Upload audit report and contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artwork-quality-${{ steps.target.outputs.theme }}-${{ github.run_number }}
          path: |
            build/artwork-quality-report.json
            build/artwork-contact-sheet.png
          if-no-files-found: warn
          retention-days: 14
