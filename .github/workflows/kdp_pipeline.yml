name: KDP Production Pipeline

on:
  workflow_dispatch:
    inputs:
      config:
        description: Book configuration JSON path
        required: true
        default: config/book_meta.json
        type: string
  push:
    branches:
      - main
    paths:
      - "config/**"
      - "scripts/**"
      - "assets/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/kdp_pipeline.yml"

permissions:
  contents: read

concurrency:
  group: kdp-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned open-source dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -t . -v

      - name: Build and validate KDP sample
        env:
          BOOK_CONFIG: ${{ inputs.config || 'config/book_meta.json' }}
        run: |
          set -euo pipefail
          python -m scripts.pipeline --config "$BOOK_CONFIG" --output-dir build/output

      - name: Upload sample PDFs and inspection files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kdp-fruit-friends-sample-${{ github.run_number }}
          path: |
            build/output/interior.pdf
            build/output/cover.pdf
            build/output/validation-report.json
            build/output/sample-preview.png
            build/output/manifest.json
          if-no-files-found: error
          retention-days: 14
